[extend]
useDefault = true

# Histórico: STORAGE_KEY de localStorage en componentes ya retirados.
# gitleaks escanea el historial completo; estos paths evitan falsos positivos.
[[allowlists]]
description = "Clave de localStorage del banner histórico, falso positivo"
condition = "AND"
paths = [
  '''(?:^|/)src/components/LandingBanner\.astro$''',
  '''(?:^|/)public/scripts/landing-banner\.js$''',
  '''(?:^|/)src/scripts/landing-banner\.js$''',
]
regexTarget = "line"
regexes = ['''STORAGE_KEY\s*=\s*['"][^'"]+['"]''']
